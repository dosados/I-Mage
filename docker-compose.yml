services:
  qdrant:
    image: qdrant/qdrant:v1.18.2
    container_name: image-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      # Постоянное хранилище векторов (единственный источник эмбеддингов).
      - ./data/qdrant_server/storage:/qdrant/storage
      - ./data/qdrant_server/snapshots:/qdrant/snapshots
