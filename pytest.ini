[pytest]
testpaths = tests
pythonpath = . tests
addopts = -q
filterwarnings =
    ignore::DeprecationWarning
markers =
    stress: slower stress / latency benchmarks (deselect with -m "not stress")
    api: HTTP API tests via FastAPI TestClient
    integration: tests that use real external services such as Qdrant
    qdrant: tests that require a reachable Qdrant server
    ml: tests that load and execute real ML models
    cuda: tests that require a CUDA-capable GPU
    slow: tests that can take more than a few seconds
